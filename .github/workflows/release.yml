name: Build Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and update the existing release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: workmods-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.release.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Read application version
        id: version
        env:
          PYTHONPATH: .
        run: |
          version="$(python -c "from workmods.config import APP_VERSION; print(APP_VERSION)")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"

      - name: Check whether the release already exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1 && [ "${{ github.event.inputs.force }}" != "true" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.version.outputs.version }} already exists; skipping the build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux-x86_64
            package: linux
          - os: windows-latest
            artifact: windows-x86_64
            package: windows
          - os: macos-latest
            artifact: macos
            package: macos
    runs-on: ${{ matrix.os }}
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_CERTIFICATE_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
      MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
      MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
      MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.0"

      - name: Install Linux Qt runtime libraries
        if: matrix.package == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libfreetype6 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libgl1 libegl1

      - name: Build Linux client
        if: matrix.package == 'linux'
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name Workmods --add-data "data:data" main.py
          tar -czf "Workmods-${{ matrix.artifact }}.tar.gz" -C dist Workmods

      - name: Build Windows client
        if: matrix.package == 'windows'
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name Workmods --icon data/icon/app.ico --add-data "data;data" main.py

      - name: Sign Windows executable
        if: matrix.package == 'windows' && env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:TEMP 'windows.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if (-not $signtool) {
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits' -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $signtool) { throw 'signtool.exe not found on the runner' }
          & $signtool sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            /tr http://timestamp.digicert.com /td sha256 /fd sha256 dist/Workmods.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE" }
          Remove-Item $pfx -Force

      - name: Package Windows client
        if: matrix.package == 'windows'
        run: |
          Compress-Archive -Path dist/Workmods.exe -DestinationPath "Workmods-${{ matrix.artifact }}.zip"

      - name: Build macOS client
        if: matrix.package == 'macos'
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name Workmods --add-data "data:data" main.py

      - name: Import macOS signing certificate
        if: matrix.package == 'macos' && env.MACOS_CERTIFICATE_BASE64 != ''
        run: |
          echo "$MACOS_CERTIFICATE_BASE64" | base64 -D > certificate.p12
          security create-keychain -p actions temp.keychain
          security default-keychain -s temp.keychain
          security unlock-keychain -p actions temp.keychain
          security import certificate.p12 -k temp.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions temp.keychain
          rm -f certificate.p12

      - name: Sign macOS app
        if: matrix.package == 'macos' && env.MACOS_CERTIFICATE_BASE64 != ''
        run: |
          codesign --deep --force --verify --verbose --sign "$MACOS_CERTIFICATE_NAME" \
            --options runtime dist/Workmods.app

      - name: Notarize macOS app
        if: matrix.package == 'macos' && env.MACOS_NOTARIZATION_APPLE_ID != ''
        run: |
          ditto -c -k --keepParent dist/Workmods.app Workmods-macos-notarize.zip
          xcrun notarytool submit Workmods-macos-notarize.zip \
            --apple-id "$MACOS_NOTARIZATION_APPLE_ID" \
            --team-id "$MACOS_NOTARIZATION_TEAM_ID" \
            --password "$MACOS_NOTARIZATION_PASSWORD" --wait
          xcrun stapler staple dist/Workmods.app
          rm -f Workmods-macos-notarize.zip

      - name: Package macOS client
        if: matrix.package == 'macos'
        run: |
          if [ -d dist/Workmods.app ]; then target=dist/Workmods.app; else target=dist/Workmods; fi
          ditto -c -k --sequesterRsrc --keepParent "$target" "Workmods-${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: Workmods-*
          if-no-files-found: error

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums and sign them
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          cd release-assets
          sha256sum Workmods-* > SHA256SUMS
          if [ -n "$RELEASE_SIGNING_KEY" ]; then
            printf '%s' "$RELEASE_SIGNING_KEY" | base64 -d > /tmp/release-signing-key.pem
            openssl dgst -sha256 -sign /tmp/release-signing-key.pem -out SHA256SUMS.sig SHA256SUMS
            rm -f /tmp/release-signing-key.pem
            echo "Signed release checksums."
          else
            echo "::warning::RELEASE_SIGNING_KEY is not set; publishing unsigned checksums."
          fi
          cat SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Workmods ${{ needs.prepare.outputs.version }} — public beta
          body: |
            Fifth public beta of Workmods. Connects updates and mod profiles to
            the desktop GUI, adds signed release checksums, fixes the Linux
            artifact’s glibc compatibility and improves mod media support.

            **Highlights**
            - Settings → Application Updates: check, verify, install and roll back.
            - Installed → Mod Profile: enabled/disabled sets, settings presets,
              JSON export/import, and real on-disk enable/disable.
            - `SHA256SUMS` on every release; `SHA256SUMS.sig` when the signing secret
              is configured.
            - `validate-package` checks engine, Unity version, platform, client and
              SDK compatibility declared in `workmod.json`.
            - Unity SDK example and smoke suite remain included.
            - Linux builds now use Ubuntu 22.04 so the binary starts on Ubuntu 24.04
              (the 1.1c artifact required GLIBC_2.43).
            - Mod editor now keeps long icon/banner file names from pushing the
              layout out of bounds and supports GIF icons and banners, including
              animated covers in the catalog.

            **Downloads**
            - Windows x64: `Workmods-windows-x86_64.zip`
            - Linux x86_64: `Workmods-linux-x86_64.tar.gz`
            - macOS: `Workmods-macos.zip` (built on the current GitHub macOS runner)

            **Install**
            1. Download the archive for your system and unpack it.
            2. Run `Workmods.exe` on Windows, `Workmods` on Linux, or `Workmods.app` on macOS.
            3. Linux: `chmod +x Workmods` before the first launch.

            The build is self-contained; Python and PyQt6 are included. The Unity SDK
            remains a single file: [`unity-sdk/WorkmodsSDK.cs`](https://github.com/Made-by-One/Devers-Workmods/blob/main/unity-sdk/WorkmodsSDK.cs).

            See the [README](https://github.com/Made-by-One/Devers-Workmods#readme) and
            [CHANGELOG](https://github.com/Made-by-One/Devers-Workmods/blob/main/CHANGELOG.md)
            for the full 1.2b notes.
          files: release-assets/*
          prerelease: true
          fail_on_unmatched_files: true
