name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (undefined names, unused imports)
        run: ruff check --select E9,F workmods tests .github/scripts
      - name: Test
        run: pytest -q

  unity-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test Unity SDK with stubs
        run: dotnet run --project unity-sdk/tests/WorkmodsSDK.Tests.csproj --nologo
