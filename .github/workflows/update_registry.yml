name: Update Mod Registry

on:
  repository_dispatch:
    types: [add_mod, remove_mod]

permissions:
  contents: write

# Two publishers finishing at once must not overwrite each other's entry.
concurrency:
  group: registry-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update registry.json
        env:
          EVENT_ACTION: ${{ github.event.action }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
          BOT_SECRET: ${{ secrets.BOT_SECRET_TOKEN }}
        run: python .github/scripts/update_registry.py

      - name: Validate registry JSON
        run: python -c "import json; json.load(open('registry.json', encoding='utf-8')); print('registry.json is valid')"

      - name: Commit changes
        run: |
          git config --global user.name 'Workmods Bot'
          git config --global user.email 'bot@workmods.local'
          git add registry.json
          if git diff --staged --quiet; then
            echo "No registry changes to commit."
            exit 0
          fi
          git commit -m "Registry update: ${EVENT_ACTION:-add_mod}"
          git push

      - name: Summary
        env:
          REGISTRY_CONTENT: ${{ toJson(github.event.client_payload) }}
        run: |
          python - <<'PY'
          import json, os
          payload = json.loads(os.environ.get("REGISTRY_CONTENT") or "{}")
          registry = json.load(open("registry.json", encoding="utf-8"))
          print(f"Mods in registry: {len(registry.get('mods', []))}")
          print(f"Last event mod: {payload.get('name', 'n/a')} [{payload.get('game_id', 'default')}]")
          PY
