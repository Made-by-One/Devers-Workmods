name: Rebuild Mod Registry

on:
  push:
    branches: [main]
    paths:
      - "submissions/**"
  workflow_dispatch:

permissions:
  contents: write

# A merged submission must not race with another rebuild.
concurrency:
  group: registry-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild registry.json
        run: python .github/scripts/update_registry.py rebuild

      - name: Validate registry JSON
        run: python -c "import json; json.load(open('registry.json', encoding='utf-8')); print('registry.json is valid')"

      - name: Commit changes
        run: |
          git config --global user.name 'Workmods Bot'
          git config --global user.email 'bot@workmods.local'
          git add registry.json
          if git diff --staged --quiet; then
            echo "registry.json is already up to date."
            exit 0
          fi
          git commit -m "Rebuild registry from submissions"
          git push

      - name: Summary
        run: |
          python - <<'PY'
          import json

          registry = json.load(open("registry.json", encoding="utf-8"))
          mods = registry.get("mods", [])
          print("Mods in registry: %d" % len(mods))
          for mod in mods:
              print("- %s [%s] v%s" % (mod.get("id"), mod.get("game_id"), mod.get("version")))
          PY
